appId: com.gmunozc.prradar
productName: PR Radar
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - "*.png"
asar: true
# Chromium's own strings (context menus, form messages) only in the app's languages; the
# other 53 languages add ~47 MB.
electronLanguages: [en, en_GB, es, es_419]
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      # One installer per architecture: a universal app carries both and is twice the size.
      arch: [arm64, x64]
  identity: "-"
  # Hardened runtime is only needed for notarization; with ad-hoc signing it can block launch.
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSUserNotificationAlertStyle: alert
dmg:
  artifactName: PR-Radar-${version}-${arch}.${ext}
  # No blockmap: the app doesn't update itself, and the hook below rewrites the dmg.
  writeUpdateInfo: false
afterAllArtifactBuild: ./scripts/compress-dmg.mjs
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  category: Development
  target:
    - AppImage
