name: Release

# Pushing a tag vX.Y.Z builds the macOS app and creates a *draft* GitHub Release with the
# dmg and its checksum. Review the draft and publish it by hand.
# Manual runs (workflow_dispatch) only build and upload the dmg as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance attestation (public repository only).
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm run typecheck
      - run: npm test

      - name: Build
        run: npm run build
        env:
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          MAIN_VITE_GITHUB_APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          MAIN_VITE_GITHUB_APP_SLUG: ${{ vars.APP_SLUG }}

      - name: Client IDs are embedded in the build
        run: |
          if [ -n "${{ vars.OAUTH_CLIENT_ID }}" ]; then grep -q "${{ vars.OAUTH_CLIENT_ID }}" out/main/index.js; fi
          if [ -n "${{ vars.APP_CLIENT_ID }}" ]; then grep -q "${{ vars.APP_CLIENT_ID }}" out/main/index.js; fi

      - name: Package (ad-hoc signed, Apple Silicon and Intel)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # hdiutil is occasionally flaky on CI runners.
          for attempt in 1 2 3; do
            npx electron-builder --mac --publish never && break
            echo "electron-builder failed (attempt $attempt), retrying in 15 s"
            sleep 15
          done
          ls dist/*.dmg

      - name: Verify the apps
        run: |
          # Each app carries a single architecture (a universal one would be twice the size).
          check() {
            lipo -archs "$1/Contents/MacOS/PR Radar" | grep -qx "$2"
            lipo -archs "$1/Contents/Frameworks/Electron Framework.framework/Electron Framework" | grep -qx "$2"
            codesign -dv "$1" 2>&1 | grep -q "Signature=adhoc"
            codesign --verify --deep --strict "$1"
          }
          check "dist/mac-arm64/PR Radar.app" arm64
          check "dist/mac/PR Radar.app" x86_64
          du -sh dist/mac*/*.app dist/*.dmg

      # The app exits 0 once the panel has rendered (PR_RADAR_SMOKE=1), 1 after 60 s without it.
      - name: Start the app (smoke test)
        run: PR_RADAR_SMOKE=1 "dist/mac-arm64/PR Radar.app/Contents/MacOS/PR Radar"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.dmg | tee SHA256SUMS.txt

      - name: Build provenance attestation
        if: startsWith(github.ref, 'refs/tags/') && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.dmg

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt
          --draft --title "PR Radar ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Upload build (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-radar-macos
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
          retention-days: 7
